  <text x="50%"
        y`="52%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="-4">

    <tspan fill="url(#navmark-main)">N</tspan>
    <tspan fill="url(#navmark-accent)" font-size="64" font-weight="700" dx="-2">a</tspan>
    <tspan fill="url(#navmark-main)" dx="-2">N</tspan>

  </text>
</svg>