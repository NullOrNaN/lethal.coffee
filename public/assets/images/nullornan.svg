<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 260 120"
     role="img"
     aria-labelledby="title">

    <title id="title">NullorNaN Systems</title>
    <defs>
    <linearGradient id="wordmark-main" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="var(--logo-main-start, #e6edf3)" />
        <stop offset="50%" stop-color="var(--logo-main-mid, #f8fafc)" />
        <stop offset="100%" stop-color="var(--logo-main-end, #c7d6e6)" />
    </linearGradient>

    <linearGradient id="wordmark-accent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--logo-accent-start, #7dd3fc)" />
        <stop offset="55%" stop-color="var(--logo-accent-mid, #38bdf8)" />
        <stop offset="100%" stop-color="var(--logo-accent-end, #60a5fa)" />
    </linearGradient>
    </defs>
